name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - run: make GO=go test package cpa
      - run: docker pull golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
      - run: make GO=go soak-test SOAK_SECONDS=120
      - name: Verify clean public export
        run: |
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp"
          make -C "$tmp" GO=go test package
          cmp dist/release/quota-first-router_0.1.0_linux_amd64.zip "$tmp/dist/release/quota-first-router_0.1.0_linux_amd64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64-release
          path: dist/release/*
          if-no-files-found: error
