name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Require tag and source version match
        run: test "$GITHUB_REF_NAME" = "v$(make -s version)"
      - run: make GO=go test package cpa
      - run: docker pull golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
      - run: make GO=go soak-test SOAK_SECONDS=120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: dist/release/*
          if-no-files-found: error
  publish-draft:
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: dist/release
      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/release.py verify --archive dist/release/quota-first-router_$(make -s version)_linux_amd64.zip --checksums dist/release/checksums.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Quota First Router $GITHUB_REF_NAME" --notes-file docs/releases/$(make -s version).md dist/release/*.zip dist/release/checksums.txt
