name: Publish approved release
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful CI run ID containing verified-six-platform-release
        required: true
        type: string
      tag:
        description: Existing immutable tag matching source version
        required: true
        type: string
      confirm_publish:
        description: Publish this reviewed release (requires separate operator approval)
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    if: inputs.confirm_publish
    environment: release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify run, tag and exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ inputs.validation_run }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          tag=os.environ['TAG'];run=os.environ['RUN']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag) and run.isdigit()
          assert tag=='v'+subprocess.check_output(['python3','scripts/release.py','version'],text=True).strip()
          info=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/runs/{run}'],text=True))
          assert info['conclusion']=='success' and info['path']=='.github/workflows/ci.yml'
          assert info['head_sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-six-platform-release
          path: dist/release
          run-id: ${{ inputs.validation_run }}
          github-token: ${{ github.token }}
      - name: Validate all six packages and native acceptance before publication
        run: python3 scripts/release.py matrix --output dist/release --require-native
      - name: Publish approved immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --title "Quota First Router $TAG" --notes-file "docs/releases/${TAG#v}.md" dist/release/*.zip dist/release/checksums.txt
