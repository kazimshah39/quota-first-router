# Merge only this plugin entry into your existing CPA configuration.
# Never replace your whole production configuration with this example.
plugins:
  enabled: true
  dir: /path/to/plugins
  configs:
    quota-first-router:
      enabled: true
      priority: 100
      poll_interval: 1m
      max_age: 5m
      request_timeout: 10s
      # Optional. See docs/operations.md for private state provisioning.
      warmup_after_reset: false
      # warmup_model: gpt-5.6-terra
      # warmup_cpa_url: http://127.0.0.1:8317
      # warmup_state_dir: /path/to/private/quota-first-router-warmup
      # Mirror requests.proxy-url if CPA has a global proxy configured.
      # proxy_url: http://127.0.0.1:8080
