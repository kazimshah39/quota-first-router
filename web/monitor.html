<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quota First Router · Monitor</title>
  <link rel="stylesheet" href="monitor.css">
  <script src="monitor.js" defer></script>
</head>
<body><main>
  <header class="page-head">
    <div><h1>Routing monitor</h1><p id="connection" role="status">Loading monitor…</p></div>
    <div class="toolbar">
      <button id="refresh">Refresh now</button>
      <details class="options"><summary>Options</summary><div class="option-panel"><button id="theme">Theme: auto</button><button id="signout">Forget key</button></div></details>
    </div>
  </header>
  <form id="login" class="panel" hidden>
    <h2>Connect to management</h2>
    <p class="muted">Your key stays in memory for this tab only.</p>
    <label for="key">Management key</label>
    <div class="login-controls"><input id="key" type="password" autocomplete="current-password" required><button>Connect</button></div>
  </form>
  <div id="private" hidden>
    <section class="health panel" aria-label="Health summary">
      <div class="health-status"><h2 id="health">Starting</h2><p id="health-note" class="muted"></p></div>
      <dl id="summary"></dl>
    </section>
    <section class="quota-section" aria-labelledby="account-heading">
      <div class="section-head">
        <h2 id="account-heading">Account quota</h2>
        <div class="filters">
          <label>Find account<input id="search" type="search" placeholder="Email or account name"></label>
          <label>Model<select id="model"><option value="">Latest selection</option></select></label>
        </div>
      </div>
      <p id="order-note" class="muted order-note"></p>
      <p id="coverage" class="warning" hidden></p>
      <div id="accounts" class="accounts"></div>
    </section>
    <details class="panel history-panel">
      <summary>Routing activity <span id="activity-count" class="muted"></span></summary>
      <div class="activity-body">
        <section><h2>Latest routing decision</h2><p id="latest"></p><p class="muted">To see which account served the request, check Request Events.</p></section>
        <div class="history-grid">
          <section><h2>Problems &amp; recoveries</h2><ol id="incidents" class="history"></ol></section>
          <section><h2>Recent scheduler decisions</h2><ol id="decisions" class="history"></ol></section>
        </div>
        <p id="history-note" class="muted"></p>
      </div>
    </details>
  </div>
</main></body>
</html>
