<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quota First Router · Routing monitor</title>
  <link rel="stylesheet" href="monitor.css">
  <script src="monitor.js" defer></script>
</head>
<body><main>
  <header class="page-head">
    <div class="heading">
      <h1>Account quota</h1>
      <span id="health" hidden></span>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <input id="search" type="search" placeholder="Find account" aria-label="Find account">
      <label id="model-filter" hidden><span class="sr-only">Model</span><select id="model"><option value="">Latest model</option></select></label>
      <button id="refresh" title="Reload cached quota readings">Refresh</button>
    </div>
  </header>
  <div class="status-line">
    <p id="connection" role="status">Loading monitor…</p>
    <button id="signout" class="quiet-button" hidden>Forget key</button>
  </div>
  <form id="login" class="panel" hidden>
    <label for="key">Management key</label>
    <div class="login-controls"><input id="key" type="password" autocomplete="current-password" required><button>Connect</button></div>
  </form>
  <div id="private" hidden>
    <p id="coverage" class="warning small" hidden></p>
    <div id="accounts" class="accounts"></div>
    <details class="history-panel" id="routing-activity">
      <summary>Routing activity <span id="activity-count" class="muted"></span></summary>
      <div class="activity-body">
        <ol id="activity" class="activity"></ol>
        <p id="activity-empty" class="muted small" hidden>No recent activity.</p>
        <div class="activity-foot">
          <p class="muted small">See Request Events for the account that served a request.</p>
          <button id="activity-more" class="quiet-button" aria-controls="activity" aria-expanded="false" hidden>Show more</button>
        </div>
        <p id="history-note" class="muted small" hidden></p>
      </div>
    </details>
  </div>
</main></body>
</html>
